<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Algo View — algoritmaları görünür kılan etkileşimli öğrenme ortamı (CS161 Ders 1–7 kapsamı)." />
    <title>Algo View</title>
    <script>
      // Apply the saved theme and language before first paint (no light flash in dark mode).
      try {
        var p = JSON.parse(localStorage.getItem('algoview:progress:v1') || '{}').prefs || {}
        if (p.theme === 'light' || p.theme === 'dark') document.documentElement.setAttribute('data-theme', p.theme)
        if (p.lang === 'en') document.documentElement.lang = 'en'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
